<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generator (Local)</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <header>
    <h1>🔳 本地 QR Code 產生器</h1>
    <p>透過 <code>http://127.0.0.1:5001/generate</code> 的 Python 服務產生 QR 碼。</p>
    <div id="server-status" class="status status-off">未連線</div>
  </header>

  <main>
    <section class="panel">
      <h2>輸入內容</h2>
      <label for="qr-data">文字或網址</label>
      <textarea id="qr-data" rows="3" placeholder="https://example.com"></textarea>

      <div class="grid">
        <label>模組大小 (scale)
          <input type="number" id="scale" min="1" max="20" value="8">
        </label>
      </div>

      <div class="grid">
        <label>容錯率
          <select id="error-level">
            <option value="L" selected>L (7%)</option>
            <option value="M">M (15%)</option>
            <option value="Q">Q (25%)</option>
            <option value="H">H (30%)</option>
          </select>
        </label>
        <label>Logo 與 QR 比例
          <input type="number" id="logo-scale" min="0" max="0.07" step="0.01" value="0.07">
        </label>
        <label>QR 寬度 (mm)
          <input type="number" id="qr-width" min="1" max="500" step="0.1" value="16.5">
        </label>
        <label>QR 高度 (mm)
          <input type="number" id="qr-height" min="1" max="500" step="0.1" value="16.5">
        </label>
      </div>

      <label class="file-input">Logo (SVG)
        <input type="file" id="logo" accept="image/svg+xml,.svg">
      </label>

      <button id="generate-btn" class="primary">產生 QR Code</button>
      <div id="message" role="alert"></div>
    </section>

    <section class="panel" id="result-panel">
      <h2>結果</h2>
      <div id="meta-info" class="meta-info hidden">
        <ul>
          <li id="meta-version"></li>
          <li id="meta-module-size"></li>
          <li id="meta-qr-size"></li>
          <li id="meta-clear-area"></li>
        </ul>
      </div>
      <div id="preview-container" class="preview hidden">
        <img id="preview" alt="QR 預覽">
      </div>
      <a id="download-svg" class="download-btn" download>下載 SVG</a>
      <a id="download-dxf" class="download-btn" download>下載 DXF</a>
    </section>
  </main>

  <footer>
    <p>確保已在本機啟動 <code>python offline_generator/server_flask.py</code>。</p>
  </footer>

  <script src="page.js"></script>
</body>
</html>
