<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 碼產生器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QR 碼產生器</h1>
            <p class="subtitle">固定樣式：鑽石身體、Frame 11 眼睛、Ball 13 眼球</p>
        </header>

        <main>
            <section class="control-panel">
                <div class="form-group">
                    <label for="url-input">網址/文字</label>
                    <input type="text" id="url-input" placeholder="https://example.com" value="https://www.qrcode-monkey.com">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="size-input">大小 (100-1000)</label>
                        <input type="number" id="size-input" min="100" max="1000" value="300">
                    </div>
                    <div class="form-group">
                        <label for="format-select">格式</label>
                        <select id="format-select">
                            <option value="png">PNG</option>
                            <option value="svg">SVG</option>
                            <option value="pdf">PDF</option>
                            <option value="eps">EPS</option>
                        </select>
                    </div>
                </div>

                <button id="generate-btn" class="btn btn-primary">產生 QR 碼</button>
            </section>

            <section class="preview-panel">
                <h2>預覽</h2>
                <div id="preview-container">
                    <div id="preview-placeholder">QR 碼預覽將顯示在這裡</div>
                    <img id="preview-image" alt="QR Code Preview">
                </div>
                <button id="download-btn" class="btn btn-secondary" disabled>下載 QR 碼</button>
            </section>
        </main>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>正在產生 QR 碼...</p>
        </div>

        <div id="error-message" class="error-message hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
