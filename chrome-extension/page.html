<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 碼產生器</title>
    <link rel="stylesheet" href="page.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QR 碼產生器</h1>
            <p class="subtitle">固定樣式：鑽石身體、Frame 12 眼睛、Ball 14 眼球</p>
        </header>

        <main>
            <section class="control-panel">
                <div class="form-group">
                    <label for="url-input">網址/文字</label>
                    <input type="text" id="url-input" placeholder="https://example.com" value="https://www.qrcode-monkey.com">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="size-input">大小 (100-1000)</label>
                        <input type="number" id="size-input" min="100" max="1000" value="300">
                    </div>
                </div>

                <div class="form-group logo-group">
                    <label for="logo-input">Logo 圖片（可選）</label>
                    <input type="file" id="logo-input" accept="image/png,image/jpeg,image/svg+xml">
                    <p class="helper-text">支援 PNG / JPG / SVG。檔案會上傳至 QRCode Monkey 伺服器以便生成 QR 碼。</p>
                    <div class="logo-status-row">
                        <span id="logo-status" class="logo-status">尚未上傳 Logo</span>
                        <button type="button" id="clear-logo-btn" class="btn-text" disabled>移除 Logo</button>
                    </div>
                </div>

                <div class="button-row">
                    <button id="generate-btn" class="btn btn-primary">產生 QR 碼</button>
                </div>
                <div class="download-row">
                    <button id="download-png-btn" class="btn btn-secondary" disabled>下載 PNG</button>
                    <button id="download-svg-btn" class="btn btn-secondary" disabled>下載 SVG</button>
                    <button id="download-eps-btn" class="btn btn-secondary" disabled>下載 EPS</button>
                </div>
            </section>

            <section class="preview-panel">
                <h2>預覽</h2>
                <div id="preview-container">
                    <div id="preview-placeholder">QR 碼預覽將顯示在這裡</div>
                    <img id="preview-image" alt="QR Code Preview">
                </div>
            </section>
        </main>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>正在產生 QR 碼...</p>
        </div>

        <div id="error-message" class="error-message hidden"></div>
    </div>

    <script src="page.js"></script>
</body>
</html>
